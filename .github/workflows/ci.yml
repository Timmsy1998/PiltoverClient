name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
          - php: '8.4'
            testbench: '^11.0'
          - php: '8.5'
            testbench: '^11.0'
          - php: '8.2'
            testbench: '^10.0'
            lowest: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom
          coverage: none
      - run: composer require --dev --no-update 'orchestra/testbench:${{ matrix.testbench }}' 'phpunit/phpunit:^11.5.50'
      - run: composer update --no-interaction --prefer-dist ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}
      - run: composer validate --strict
      - run: composer audit
      - run: composer test
      - run: composer generate
      - run: git diff --exit-code -- src/Http/LeagueEndpoints.php src/Contracts/RiotClientContract.php resources/openapi/openapi.json docs/endpoints.md
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer update --no-dev --no-interaction --prefer-dist
      - run: php -r 'require "vendor/autoload.php"; $client = new Timmsy\PiltoverClient\Http\RiotClient("fake"); if (count($client->endpoints()) !== 50) exit(1);'
